<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Turistas Cadastrados</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <h1>Turistas Cadastrados</h1>
        <p th:if="${erro}" th:text="${erro}" class="alert-error"></p>

        <div class="card">
            <div class="toolbar">
                <a class="btn" href="/turistas/novo">+ Novo Turista</a>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Email</th>
                        <th>Pagamento</th>
                        <th>Qtd Acompanhantes</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="turista : ${turistas}">
                        <td th:text="${turista.id}"></td>
                        <td>
                            <details>
                                <summary th:text="${turista.nome}"></summary>
                                <ul>
                                    <li th:each="acomp : ${turista.acompanhantes}"
                                        th:text="${acomp.nome + (acomp.telefone != null and !acomp.telefone.isEmpty() ? ' - ' + acomp.telefone : '')}"></li>
                                    <li th:if="${#lists.isEmpty(turista.acompanhantes)}">Nenhum acompanhante</li>
                                </ul>
                            </details>
                        </td>
                        <td th:text="${turista.email}"></td>
                        <td th:text="${turista.formaPagamento}"></td>
                        <td th:text="${#lists.size(turista.acompanhantes)}"></td>
                        <td class="actions">
                            <a class="btn btn-icon" th:href="@{'/turistas/' + ${turista.id} + '/editar'}" title="Editar">✏️</a>
                            <form th:action="@{'/turistas/' + ${turista.id} + '/deletar'}" method="post" onsubmit="return confirm('Excluir este turista?');">
                                <button type="submit" class="btn btn-icon btn-icon-danger" title="Excluir">🗑️</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <p><a href="/home">Voltar para Home</a></p>
    </div>
</body>
</html>
