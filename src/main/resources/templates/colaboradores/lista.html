<html th:replace="~{fragments/layout :: page('Equipe Operacional', ~{::section})}">
<section>
    
    <div th:if="${sucesso}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
        <i class="bi bi-check-circle me-2"></i> <span th:text="${sucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    
    <div th:if="${erro}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
        <i class="bi bi-exclamation-triangle me-2"></i> <span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold m-0">Equipe Operacional</h3>
            <p class="text-muted small m-0">Gerencie guias e motoristas da agência</p>
        </div>
        <a th:href="@{/colaboradores/novo}" class="btn btn-warning text-dark fw-bold">
            <i class="bi bi-person-plus me-1"></i> Novo Colaborador
        </a>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0 table-responsive">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th class="ps-4">Nome</th>
                        <th>Identificação</th>
                        <th>Contatos</th>
                        <th>Papel Operacional</th>
                        <th class="text-end pe-4">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="c : ${colaboradores}">
                        <td class="ps-4 fw-bold text-dark" th:text="${c.nome}"></td>
                        <td th:text="${c.identificacao}"></td>
                        <td>
                            <div th:text="${c.email}"></div>
                            <small class="text-muted" th:text="${c.telefone}"></small>
                        </td>
                        <td>
                            <span class="badge bg-primary rounded-pill" th:text="${tipos[c.id]}"></span>
                        </td>
                        <td class="text-end pe-4">
                            <a th:href="@{/colaboradores/{id}/editar(id=${c.id})}" class="btn btn-sm btn-outline-primary" title="Editar">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <form th:action="@{/colaboradores/{id}/deletar(id=${c.id})}" method="post" class="d-inline" onsubmit="return confirm('Tem certeza que deseja apagar?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger" title="Apagar">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(colaboradores)}">
                        <td colspan="5" class="text-center py-4 text-muted">Nenhum colaborador cadastrado.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</html>
