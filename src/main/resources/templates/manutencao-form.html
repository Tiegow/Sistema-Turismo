<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${manutencao.id != null ? 'Editar Manutenção' : 'Nova Manutenção'}">Nova Manutenção</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <h1 th:text="${manutencao.id != null ? 'Editar Manutenção' : 'Nova Manutenção'}"></h1>
        <p th:if="${veiculo != null}" style="color: var(--color-muted);">
            Veículo: <strong th:text="${veiculo.placa + (veiculo.modelo != null ? ' — ' + veiculo.modelo : '')}"></strong>
        </p>
        <p th:if="${erro}" th:text="${erro}" class="alert-error"></p>

        <div class="card">
            <form th:with="acao=${manutencao.id != null ? '/veiculos/' + veiculo.id + '/manutencoes/' + manutencao.id : '/veiculos/' + veiculo.id + '/manutencoes'}"
                  th:action="@{${acao}}" method="post">
                <div class="field">
                    <label>Status</label>
                    <input type="text" name="status" th:value="${manutencao.status}" placeholder="Ex.: Em andamento, Concluído" required>
                </div>
                <div class="field">
                    <label>Data de Entrada</label>
                    <input type="datetime-local" name="dataEntrada"
                           th:value="${manutencao.dataEntrada != null ? #temporals.format(manutencao.dataEntrada, 'yyyy-MM-dd''T''HH:mm') : ''}"
                           required>
                </div>
                <div class="field">
                    <label>Data de Saída — opcional</label>
                    <input type="datetime-local" name="dataSaida"
                           th:value="${manutencao.dataSaida != null ? #temporals.format(manutencao.dataSaida, 'yyyy-MM-dd''T''HH:mm') : ''}">
                </div>
                <div class="field">
                    <label>Motivo</label>
                    <input type="text" name="motivo" th:value="${manutencao.motivo}">
                </div>
                <div class="field">
                    <label>Custo (R$)</label>
                    <input type="number" name="custo" th:value="${manutencao.custo}" min="0" step="1">
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn">Salvar</button>
                    <a class="btn btn-secondary" th:href="@{'/veiculos/' + ${veiculo.id} + '/editar'}">Cancelar</a>
                </div>
            </form>
        </div>

        <p><a th:href="@{'/veiculos/' + ${veiculo.id} + '/editar'}">Voltar para o Veículo</a></p>
    </div>
</body>
</html>
