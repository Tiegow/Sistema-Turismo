<html th:replace="~{fragments/layout :: page('Gestão de Roteiros', ~{::section})}">
<section>
    
    <div th:if="${sucesso}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
        <i class="bi bi-check-circle me-2"></i> <span th:text="${sucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    
    <div th:if="${erro}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
        <i class="bi bi-exclamation-triangle me-2"></i> <span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold m-0">Catálogo de Roteiros</h3>
            <p class="text-muted small m-0">Gerencie os pacotes turísticos oferecidos pela agência</p>
        </div>
        <a th:href="@{/roteiros/novo}" class="btn btn-primary">
            <i class="bi bi-plus-lg me-1"></i> Novo Roteiro
        </a>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0 table-responsive">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th class="ps-4">Nome do Passeio</th>
                        <th>Modalidade</th>
                        <th>Duração</th>
                        <th>Preço Vigente</th>
                        <th class="text-end pe-4">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="roteiro : ${roteiros}">
                        <td class="ps-4 fw-bold text-dark" th:text="${roteiro.nome}"></td>
                        <td><span class="badge bg-secondary" th:text="${roteiro.modalidade}"></span></td>
                        <td th:text="${roteiro.duracao}"></td>
                        <td>
                            <!-- Filtra a lista de preços para exibir apenas o preço Ativo -->
                            <span class="text-success fw-bold" 
                                  th:each="precoObj : ${roteiro.historicoPrecos}" 
                                  th:if="${precoObj.ativo}" 
                                  th:text="'R$ ' + ${precoObj.preco}">
                            </span>
                            <span class="text-muted small" th:if="${#lists.isEmpty(roteiro.historicoPrecos)}">Sem Preço</span>
                        </td>
                        <td class="text-end pe-4">
                            <a th:href="@{/roteiros/{id}/editar(id=${roteiro.id})}" class="btn btn-sm btn-outline-primary" title="Editar">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <form th:action="@{/roteiros/{id}/deletar(id=${roteiro.id})}" method="post" class="d-inline" onsubmit="return confirm('Tem certeza que deseja apagar este roteiro?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger" title="Apagar">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(roteiros)}">
                        <td colspan="5" class="text-center py-4 text-muted">Nenhum roteiro cadastrado. Adicione o primeiro no botão acima.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</html>
