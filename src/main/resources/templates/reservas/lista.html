<html th:replace="~{fragments/layout :: page('Gestão de Reservas', ~{::section})}">
<section>
    
    <div th:if="${sucesso}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
        <i class="bi bi-check-circle me-2"></i> <span th:text="${sucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    
    <div th:if="${erro}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
        <i class="bi bi-exclamation-triangle me-2"></i> <span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold m-0 text-success"><i class="bi bi-cart3 me-1"></i> Balcão de Vendas</h3>
            <p class="text-muted small m-0">Gerenciamento de Reservas e Recebíveis</p>
        </div>
        <a th:href="@{/reservas/novo}" class="btn btn-success fw-bold px-4 shadow-sm">
            <i class="bi bi-ticket-perforated me-1"></i> Nova Venda
        </a>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0 table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th class="ps-4">Turista</th>
                        <th>Passeio Adquirido</th>
                        <th>Vagas / Embarque</th>
                        <th>Valor Total</th>
                        <th>Status</th>
                        <th class="text-end pe-4">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="r : ${reservas}">
                        <td class="ps-4">
                            <div class="fw-bold text-dark" th:text="${r.turista.nome}"></div>
                            <small class="text-muted"><i class="bi bi-telephone"></i> <span th:text="${r.turista.telefone}"></span></small>
                        </td>
                        <td>
                            <div class="fw-bold" th:text="${r.passeio.roteiro.nome}"></div>
                            <small class="text-muted" th:text="${#temporals.format(r.passeio.dataHora, 'dd/MM/yyyy HH:mm')}"></small>
                        </td>
                        <td>
                            <div><span class="badge bg-secondary" th:text="${r.qtdVagas} + ' Vaga(s)'"></span></div>
                            <small class="text-muted" th:text="'Emb: ' + ${r.localEmbarque}"></small>
                        </td>
                        <td>
                            <span class="fw-bold text-success" th:text="'R$ ' + ${r.valorTotal}"></span>
                        </td>
                        <td>
                            <span th:if="${r.pagamentoEfetuado}" class="badge bg-success"><i class="bi bi-check-lg"></i> Pago</span>
                            <span th:unless="${r.pagamentoEfetuado}" class="badge bg-warning text-dark"><i class="bi bi-hourglass-split"></i> Pendente</span>
                        </td>
                        <td class="text-end pe-4">
                            <a th:href="@{/reservas/{idP}/{idT}/editar(idP=${r.passeio.id}, idT=${r.turista.id})}" class="btn btn-sm btn-outline-primary" title="Ver / Editar Recibo">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <form th:action="@{/reservas/{idP}/{idT}/deletar(idP=${r.passeio.id}, idT=${r.turista.id})}" method="post" class="d-inline" onsubmit="return confirm('Deseja cancelar esta venda e estornar as vagas?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger" title="Estornar Venda">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(reservas)}">
                        <td colspan="6" class="text-center py-5 text-muted">Nenhuma venda realizada até o momento.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</html>
