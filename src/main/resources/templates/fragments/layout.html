<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org" th:fragment="page(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">TurismoDB</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
    <div class="d-flex" id="wrapper">
        
        <!-- Sidebar -->
        <div class="bg-white border-end shadow-sm" id="sidebar-wrapper" style="width: 260px; min-height: 100vh;">
            <div class="sidebar-heading p-3 border-bottom d-flex align-items-center">
                <i class="bi bi-compass-fill text-primary fs-3 me-2"></i>
                <h5 class="m-0 fw-bold">TurismoDB</h5>
            </div>
            <div class="list-group list-group-flush mt-3">
                
                <div class="px-3 text-muted small fw-bold mb-2">GERAL</div>
                <a th:href="@{/home}" class="list-group-item list-group-item-action border-0 py-2">
                    <i class="bi bi-house me-2"></i> Dashboard
                </a>
                
                <div class="px-3 text-muted small fw-bold mb-2 mt-4">GESTÃO & VENDAS</div>
                <a th:href="@{/roteiros}" class="list-group-item list-group-item-action border-0 py-2">
                    <i class="bi bi-map me-2"></i> Roteiros
                </a>
                <a th:href="@{/passeios}" class="list-group-item list-group-item-action border-0 py-2">
                    <i class="bi bi-calendar-event me-2"></i> Calendário
                </a>
                <a th:href="@{/reservas}" class="list-group-item list-group-item-action border-0 py-2">
                    <i class="bi bi-cart3 me-2"></i> Ponto de Venda
                </a>
                
                <div class="px-3 text-muted small fw-bold mb-2 mt-4">LOGÍSTICA & PESSOAS</div>
                <a th:href="@{/veiculos}" class="list-group-item list-group-item-action border-0 py-2">
                    <i class="bi bi-truck me-2"></i> Frota & Manutenção
                </a>
                <a th:href="@{/colaboradores}" class="list-group-item list-group-item-action border-0 py-2">
                    <i class="bi bi-person-badge me-2"></i> Colaboradores
                </a>
                <a th:href="@{/turistas}" class="list-group-item list-group-item-action border-0 py-2">
                    <i class="bi bi-people me-2"></i> Turistas
                </a>
            </div>
        </div>
        
        <!-- Page Content -->
        <div id="page-content-wrapper" class="flex-grow-1 w-100">
            <!-- Top Navbar -->
            <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom px-4" style="height: 70px;">
                <div class="container-fluid">
                    <h4 class="mb-0 fw-bold text-dark" th:text="${title}">Dashboard</h4>
                    <div class="d-flex align-items-center">
                        <span class="me-3 text-muted"><i class="bi bi-person-circle fs-4"></i> Gestor Operacional</span>
                    </div>
                </div>
            </nav>

            <!-- Main Content Area -->
            <div class="container-fluid p-4">
                <div th:replace="${content}"></div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
